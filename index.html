   ["Torwart Karlheinz Volz hielt im Finale einen Elfmeter von Werner Biskup. Laut Wikipedia gewann mit den Kickers erstmals ein Zweitligist den Pokal, die Regionalliga war damals die zweite Liga. Im selben Jahr stieg der Verein in die Bundesliga auf.","Goalkeeper Karlheinz Volz saved a penalty from Werner Biskup in the final. According to Wikipedia the Kickers were the first second-division club to win the cup; the Regionalliga was then the second tier. The club was promoted to the Bundesliga in the same year.","Torwart Karlheinz Volz hot im Finale en Elfmeter vun Werner Biskup gehalte. Laut Wikipedia hot mit de Kickers erschtmols en Zweitligist de Pokal gewunne, die Regionalliga war damals die zwaat Liga. Im selwe Jahr is der Verein in die Bundesliga uffgestiege."]]

 pro:["Die Spielminute von Winkler wird je nach Quelle mit der 25. bis 27. Minute angegeben, und der Name des Trainers wird uneinheitlich geschrieben (Aki Schmidt oder Schmitt). Deshalb nennt die Lektion beides nicht.","The minute of Winkler's goal is given as the 25th to 27th depending on the source, and the coach's name is spelled inconsistently (Aki Schmidt or Schmitt). That is why the lesson names neither.","Die Spielminut vum Winkler wird je nach Quell mit der 25. bis 27. Minut angegewwe, un der Name vum Trainer wird uneinheitlisch geschriwwe (Aki Schmidt odder Schmitt). Deshalb nennt die Lektion beides net."],

   ["Erwin Kostedde spielte von 1971 bis 1975 für die Kickers. Am 22. Dezember 1974 wurde er der erste schwarze Nationalspieler Westdeutschlands: In Malta gewann das Team 1:0 in der EM-Qualifikation.","Erwin Kostedde played for the Kickers from 1971 to 1975. On 22 December 1974 he became West Germany's first Black national player: the team won 1-0 in Malta in a European Championship qualifier.","Erwin Kostedde hot vun 1971 bis 1975 fer die Kickers gespielt. Am 22. Dezember 1974 is er der erscht schwarze Nationalspieler vun Westdeitschland worrn: In Malta hot des Team 1:0 gewunne in der EM-Qualifikation."]],
  [["Rudi Völler","Rudi Völler","Rudi Völler"],
   ["Der in Hanau geborene Rudi Völler spielte von 1977 bis 1980 bei den Kickers-Profis, seinem ersten Profiklub. 1990 wurde er Weltmeister, von 2000 bis 2004 war er Teamchef der Nationalmannschaft.","Rudi Völler, born in Hanau, played for the Kickers' first team from 1977 to 1980, his first professional club. He became world champion in 1990 and was national team head coach from 2000 to 2004.","Der in Hanau geborene Rudi Völler hot vun 1977 bis 1980 bei de Kickers-Profis gespielt, seim erschte Profiklub. 1990 is er Weltmeister worrn, vun 2000 bis 2004 war er Teamchef vun der Nationalmannschaft."]],
  [["Viele bekannte Namen","Many famous names","Viele bekannte Name"],

 cards:[
  [["Zwei Endspiele um die Meisterschaft","Two finals for the championship","Zwaa Endspiele um die Meisterschaft"],
   ["Zweimal stand der OFC im Endspiel um die deutsche Meisterschaft und wurde Vizemeister: 1950 verlor er gegen den VfB Stuttgart, 1959 in Berlin vor 75.000 Zuschauern nach Verlängerung 3:5 gegen Eintracht Frankfurt.","Twice the OFC reached the final of the German championship and finished runner-up: in 1950 it lost to VfB Stuttgart, in 1959 in Berlin in front of 75,000 spectators it lost 3-5 after extra time to Eintracht Frankfurt.","Zwaamol war der OFC im Endspiel um die deitsch Meisterschaft un is Vizemeister worrn: 1950 hot er gegen de VfB Stuttgart verlore, 1959 in Berlin vor 75.000 Zuschauer nach Verlängerung 3:5 gegen Eintracht Frankfurt."]],
  [["Bundesliga: sieben Saisons","Bundesliga: seven seasons","Bundesliga: siewe Saisone"],
   ["Beim Start der Bundesliga 1963 war der OFC nicht dabei. 1968 gelang der Aufstieg, insgesamt spielte der Verein sieben Bundesliga-Saisons, die letzte 1983/84. Am 1. Spieltag 1974/75 schlug er den FC Bayern München 6:0, laut OFC der höchste Bundesliga-Sieg der Vereinsgeschichte.","The OFC was not part of the Bundesliga when it started in 1963. Promotion came in 1968, and in total the club played seven Bundesliga seasons, the last in 1983/84. On matchday 1 of 1974/75 it beat FC Bayern München 6-0, according to the OFC the highest Bundesliga win in its history.","Beim Start vun der Bundesliga 1963 war der OFC net debei. 1968 hot's mit em Uffstieg geklappt, insgesamt hot der Verein siewe Bundesliga-Saisone gespielt, die letzt 1983/84. Am 1. Spieltag 1974/75 hot er de FC Bayern Minche 6:0 geschlage, laut OFC der höchste Bundesliga-Sieg vun der Vereinsgeschicht."]],
  [["Nach unten und wieder zurück","Down and back up again","Nach unne un widder zurick"],
   ["2000 stieg der OFC nach einer Saison aus der 2. Bundesliga ab, 2005 kehrte er zurück. 2013 ging es in die Regionalliga, in der der Verein bis heute spielt. 2015 wurde er dort Meister der Regionalliga Südwest. Stand Oktober 2026 spielt er in der Regionalliga Südwest.","In 2000 the OFC dropped out of the 2. Bundesliga after one season and returned in 2005. In 2013 it went down to the Regionalliga, where the club has played ever since. In 2015 it won the Regionalliga Südwest there. As of October 2026 it plays in the Regionalliga Südwest.","2000 is der OFC nach aaner Saison aus der 2. Bundesliga abgestiege, 2005 is er zurickgekomme. 2013 ging's in die Regionalliga, wo der Verein bis heut spielt. 2015 is er dort Meister vun der Regionalliga Südwest worrn. Stand Oktober 2026 spielt er in der Regionalliga Südwest."]]

 pro:["Der Bundesliga-Skandal 1971 geht auf OFC-Präsident Horst-Gregorio Canellas zurück, der Spielmanipulationen öffentlich machte. Die Zahl der Bundesliga-Jahre schwankt in der Wikipedia je nach Zählweise; die sieben Saisons ergeben sich aus der Zuschauertabelle.","The 1971 Bundesliga scandal goes back to OFC president Horst-Gregorio Canellas, who made match-fixing public. The number of Bundesliga years varies in Wikipedia depending on how it is counted; the seven seasons come from the attendance table.","Der Bundesliga-Skandal 1971 geht uff de OFC-Präsident Horst-Gregorio Canellas zurick, der Spielmanipulatione öffentlisch gemacht hot. Die Zahl vun de Bundesliga-Jahre schwankt in der Wikipedia je nach Zählweis; die siewe Saisone ergewwe sisch aus der Zuschauertabell."],

 cards:[

   ["Das Stadion am Bieberer Berg liegt in Offenbach am Main (Anschrift: Waldemar-Klein-Platz 1) und wurde 1921 eröffnet. Der Name geht auf eine Anhöhe nahe dem Stadtteil Bieber zurück.","The Stadion am Bieberer Berg is in Offenbach am Main (address: Waldemar-Klein-Platz 1) and opened in 1921. The name goes back to a hill near the district of Bieber.","Des Stadion am Bieberer Berg liggt in Offebach am Maa (Adress: Waldemar-Klein-Platz 1) un is 1921 eröffnet worrn. Der Name geht uff e Anhöh in der Näh vum Stadtdeil Bieber zurick."]],
  [["Umbau 2011/12","Rebuild 2011/12","Umbau 2011/12"],
   ["Das Stadion wurde 2011 und 2012 während des Spielbetriebs umgebaut und neu eröffnet; zum Eröffnungsspiel kam Bayer 04 Leverkusen. Heute fasst es rund 20.500 Plätze, laut OFC etwa 11.000 Sitz- und 9.500 Stehplätze (Stand Oktober 2026).","The stadium was rebuilt in 2011 and 2012 while matches went on and was reopened; Bayer 04 Leverkusen came for the opening match. Today it holds about 20,500, according to the OFC roughly 11,000 seats and 9,500 standing places (as of October 2026).","Des Stadion is 2011 un 2012 während em Spielbetrieb umgebaut un neu eröffnet worrn; zum Eröffnungsspiel is Bayer 04 Leverkusen komme. Heut fasst's rund 20.500 Plätz, laut OFC ungefähr 11.000 Sitz- un 9.500 Stehplätz (Stand Oktober 2026)."]],
  [["Tribünen und Rekord","Stands and record","Tribüne un Rekord"],
   ["Die Gegengerade heißt Waldemar-Klein-Tribüne und ist die große Stehplatztribüne, die Haupttribüne trägt den Namen von Hermann Nuber. Den Zuschauerrekord am Bieberer Berg gab es am 19. September 1968: 33.000 sahen ein 2:3 gegen 1860 München.","The opposite stand is called Waldemar-Klein-Tribüne and is the big standing terrace; the main stand carries the name of Hermann Nuber. The attendance record at the Bieberer Berg was on 19 September 1968: 33,000 saw a 2-3 against 1860 Munich.","Die Gegengerad haaßt Waldemar-Klein-Tribüne un is die groß Stehplatztribün, die Haupttribün trägt de Name vum Hermann Nuber. Den Zuschauerrekord am Bieberer Berg hot's am 19. September 1968 gewwe: 33.000 hawwe e 2:3 gegen 1860 Minche gesehe."]]

 pro:["Kapazitäten werden unterschiedlich angegeben (OFC: etwa 11.000 Sitz- und 9.500 Stehplätze; Wikipedia: rund 10.300 Sitz- und 10.200 Stehplätze). Auch der Eröffnungstag 1921 wird in den Quellen unterschiedlich genannt, deshalb steht hier nur das Jahr.","Capacities are stated differently (OFC: about 11,000 seats and 9,500 standing; Wikipedia: roughly 10,300 seats and 10,200 standing). The opening day in 1921 is also given differently in the sources, which is why only the year is stated here.","Kapazitäte werre unnerschiedlisch angegewwe (OFC: ungefähr 11.000 Sitz- un 9.500 Stehplätz; Wikipedia: rund 10.300 Sitz- un 10.200 Stehplätz). Aach der Eröffnungstag 1921 werd in de Quelle unnerschiedlisch genannt, deshalb steht hier nur des Jahr."],

 cards:[

  [["Fanmuseum und ERWIN","Fan museum and ERWIN","Fanmuseum un ERWIN"],

  function nameNudge(){

/* Feste Orientierungsleiste: Hoehen messen, Schatten nur wenn festgeheftet */
function syncHH(){
  const r = document.documentElement.style, e = document.querySelector(".top"), n = document.querySelector(".stickynav");
  if(e) r.setProperty("--hh", e.getBoundingClientRect().height + "px");
  r.setProperty("--nh", n ? n.getBoundingClientRect().height + "px" : "0px");
  stuckPruefen();
}
function stuckPruefen(){
  const n = document.querySelector(".stickynav"); if(!n) return;
  const top = parseFloat(getComputedStyle(n).top) || 0;
  n.classList.toggle("stuck", scrollY > 2 && n.getBoundingClientRect().top <= top + 1);
}
addEventListener("resize", syncHH);
let stuckBusy = false;
addEventListener("scroll", () => { if(stuckBusy) return; stuckBusy = true; requestAnimationFrame(() => { stuckBusy = false; stuckPruefen(); }); }, {passive:true});
{ const _render = render; render = function(...a){ const r = _render.apply(this, a); syncHH(); return r; }; }
syncHH();
